<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Brain Dumper</title>
<style>
/*
 * The device draws one bit per pixel on warm grey glass, and highlights a row
 * by inverting it. This page borrows both: no hue anywhere, emphasis by
 * inversion, and the only grey in the design is a real 2px dither rather than
 * an opacity. Nothing is fetched from the internet - the phone reading this
 * may be on a network that has none.
 */
:root{
  --paper:#e4e2db; --ink:#16181a; --soft:#5f6367; --rule:#c6c3bb;
  --sp:16px;
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#101214; --ink:#e2e0d9; --soft:#8d9296; --rule:#2b2f33; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace}
.wrap{max-width:620px;margin:0 auto}

/* --- the device's own status bar, inverted --------------------------- */
.bar{
  background:var(--ink); color:var(--paper);
  padding:calc(var(--sp) - 2px) var(--sp) 14px;
  padding-top:calc(var(--sp) - 2px + env(safe-area-inset-top));
  width:100%; border:0; text-align:left; display:block; cursor:pointer;
  font-family:inherit;
}
.bar:focus-visible{outline:3px solid var(--paper);outline-offset:-6px}
.brand{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:10px; letter-spacing:.24em; text-transform:uppercase;
}
.brand b{font-weight:600}
.brand span{opacity:.55}
.clock{
  font-size:44px; line-height:1; letter-spacing:-.03em; font-weight:500;
  margin:8px 0 10px; font-variant-numeric:tabular-nums;
}
.clock small{font-size:13px;letter-spacing:.18em;margin-left:10px;opacity:.55;vertical-align:.5em}
.vitals{font-size:11px;letter-spacing:.1em;text-transform:uppercase;line-height:1.9}
.vitals i{font-style:normal;opacity:.45;padding:0 .45em}
.hint{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.45;margin-top:6px}

/* --- section rule with the bar's scale on the right ------------------ */
.scale{
  display:flex; align-items:baseline; gap:10px;
  padding:20px var(--sp) 0;
  font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--soft);
}
.scale hr{flex:1;border:0;border-top:1px dotted var(--rule);margin:0}

/* --- notes ----------------------------------------------------------- */
ol{list-style:none;margin:0;padding:0}
.day{
  padding:22px var(--sp) 6px;
  font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--soft);
}
.note{border-top:1px solid var(--rule)}
.note:last-child{border-bottom:1px solid var(--rule)}
.head{
  display:block; width:100%; text-align:left; background:none; border:0;
  color:inherit; font:inherit; padding:13px var(--sp) 2px; cursor:pointer;
}
.head:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
.meta{
  display:flex; gap:.6em; align-items:center;
  font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--soft);
}
.meta .id{color:var(--ink);font-weight:600}
.meta .grow{flex:1}
.flag{padding:2px 6px; font-size:9.5px; letter-spacing:.14em}
/* waiting is a state, not a problem: a dashed outline says so without shouting */
.flag.wait{border:1px dashed var(--rule)}
/* a failed transcription is the one thing on a row worth interrupting for */
.flag.bad{background:var(--ink); color:var(--paper)}
.title{
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  font-size:15px; line-height:1.35; letter-spacing:-.015em; font-weight:500;
  margin:7px 0 0; overflow:hidden; display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical;
}

/* the signature: duration drawn to scale, and the scrub bar when playing */
.track{
  display:block; width:100%; background:none; border:0; cursor:pointer;
  padding:11px var(--sp) 15px; -webkit-tap-highlight-color:transparent;
}
.track:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
.bar2{
  height:9px; display:flex; align-items:center;
  background:linear-gradient(var(--rule),var(--rule)) 0 50%/100% 1px no-repeat;
}
.bar2 i{display:block;height:9px;background:var(--ink)}
.len{
  display:flex; justify-content:space-between; margin-top:7px;
  font-size:11px; letter-spacing:.08em; color:var(--soft);
  font-variant-numeric:tabular-nums;
}
.len .cue{color:var(--ink)}

/* --- expanded ------------------------------------------------------- */
.body{padding:0 var(--sp) 20px}
.text{white-space:pre-wrap;margin:0 0 18px;font-size:16px;line-height:1.6}
.text.none{color:var(--soft);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts .del{margin-left:auto}
.btn{
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink); background:var(--paper); border:1px solid var(--ink);
  padding:11px 14px; min-height:42px; cursor:pointer; text-decoration:none;
  display:inline-flex; align-items:center;
}
.btn:active,.btn.on{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* the e-paper flash: a deleted row inverts before it goes, the way the panel
   does on a full refresh */
.note.gone{background:var(--ink);color:var(--paper)}
.note.gone .bar2 i{background:var(--paper)}
.note.gone .meta,.note.gone .len{color:var(--paper);opacity:.7}
.note.shrink{
  height:0;overflow:hidden;padding:0;border-top-color:transparent;
  transition:height .22s ease-in;
}

/* --- states ---------------------------------------------------------- */
.msg{margin:0;padding:26px var(--sp);border-top:1px solid var(--rule)}
.msg h2{font-size:15px;margin:0 0 6px;font-weight:600}
.msg p{margin:0 0 14px;color:var(--soft);font-size:14px}
footer{
  padding:26px var(--sp) calc(30px + env(safe-area-inset-bottom));
  font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--soft);
}
@media (prefers-reduced-motion:reduce){
  .note.shrink{transition:none}
}
</style>
</head>
<body>
<div class="wrap">

  <button class="bar mono" id="bar" aria-label="Stato del dispositivo, tocca per aggiornare">
    <span class="brand"><b>Brain&nbsp;Dumper</b><span id="ver"></span></span>
    <div class="clock" id="clock">--:--</div>
    <div class="vitals" id="vitals">in ascolto&hellip;</div>
    <div class="hint">tocca per aggiornare</div>
  </button>

  <main id="main"></main>

  <footer class="mono" id="foot"></footer>
</div>

<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };

let status = null, notes = [], open = 0, scaleMs = 60000;
const audio = new Audio();
audio.preload = "none";
let playing = 0;

/* Times are the device's, not the phone's: shift the epoch by the offset the
   device reports and then read the UTC fields. */
const local = (epoch) => new Date((epoch + (status ? status.tz_offset_s : 0)) * 1000);
const p2 = (n) => String(n).padStart(2, "0");
const hhmm = (d) => p2(d.getUTCHours()) + ":" + p2(d.getUTCMinutes());
const dur = (ms) => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ":" + p2(s % 60); };
const gb = (b) => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : Math.round(b / 1e6) + " MB";

const DAYS = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];
function dayLabel(epoch) {
  const d = local(epoch), now = local(status ? status.time : epoch);
  const key = (x) => x.getUTCFullYear() * 1e4 + x.getUTCMonth() * 100 + x.getUTCDate();
  if (key(d) === key(now)) return "oggi";
  const y = new Date(now.getTime() - 864e5);
  if (key(d) === key(y)) return "ieri";
  return DAYS[d.getUTCDay()] + " " + p2(d.getUTCDate()) + "/" + p2(d.getUTCMonth() + 1);
}

/* ---------------- header ---------------- */
function drawStatus() {
  if (!status) return;
  $("#ver").textContent = status.version || "";
  const now = local(status.time);
  $("#clock").innerHTML = hhmm(now) + "<small>" + p2(now.getUTCDate()) + "/" +
    p2(now.getUTCMonth() + 1) + "</small>";

  const bits = [];
  bits.push("batt " + status.battery_pct + "%" + (status.usb_power ? " in carica" : ""));
  bits.push(status.wifi.ip !== "0.0.0.0" ? status.wifi.rssi + " dbm" : "offline");
  bits.push(status.sd.mounted ? "sd " + gb(status.sd.free_bytes) + " liberi" : "sd assente");
  if (status.temp_c !== null) bits.push(Math.round(status.temp_c) + "°c " + Math.round(status.humidity) + "%");
  if (status.notes.pending) bits.push("coda " + status.notes.pending);
  if (status.audio !== "idle") bits.push(status.audio === "recording" ? "sta registrando" : "in riproduzione");
  $("#vitals").innerHTML = bits.join('<i>·</i>');
}

/* ---------------- list ---------------- */
function drawList() {
  const main = $("#main");
  main.textContent = "";

  if (!notes.length) {
    main.append(message("Nessuna nota sulla scheda.",
      "Tieni premuto il tasto BOOT sul dispositivo e parla.", null));
    return;
  }

  scaleMs = Math.max(60000, ...notes.map(n => n.duration_ms));
  const head = el("div", "scale mono");
  head.innerHTML = "<span>" + notes.length + (notes.length === 1 ? " nota" : " note") +
    "</span><hr><span>scala 0–" + dur(scaleMs) + "</span>";
  main.append(head);

  let list = null, day = null;
  for (const n of notes) {
    const d = dayLabel(n.created);
    if (d !== day) {
      day = d;
      const h = el("div", "day mono"); h.textContent = d; main.append(h);
      list = el("ol"); main.append(list);
    }
    list.append(row(n));
  }
}

function row(n) {
  const li = el("li", "note");
  li.dataset.id = n.id;

  const head = el("button", "head");
  head.setAttribute("aria-expanded", open === n.id ? "true" : "false");

  const meta = el("div", "meta mono");
  meta.innerHTML = '<span class="id">' + String(n.id).padStart(4, "0") + "</span>" +
    "<span>" + hhmm(local(n.created)) + "</span>" +
    "<span>" + esc(n.tag) + '</span><span class="grow"></span>';
  if (n.stt === "pending") meta.append(flag("in coda", "wait"));
  else if (n.stt === "failed") meta.append(flag("errore stt", "bad"));
  head.append(meta);

  const t = el("div", "title");
  t.textContent = n.title || "Nota " + n.id;
  head.append(t);
  head.onclick = () => { open = open === n.id ? 0 : n.id; drawList(); };
  li.append(head);

  li.append(track(n));

  if (open === n.id) li.append(panel(n));
  return li;
}

function flag(text, kind) {
  const s = el("span", "flag " + kind);
  s.textContent = text;
  return s;
}

/* The bar is the one control that matters: it shows how long the note is and,
   once it is playing, where you are in it. Tapping it seeks. */
function track(n) {
  const b = el("button", "track");
  b.setAttribute("aria-label", "Riproduci la nota " + n.id);
  const bar = el("div", "bar2");
  const fill = el("i");
  fill.style.width = pct(n) + "%";
  bar.append(fill);
  const len = el("div", "len mono");
  len.innerHTML = '<span class="cue" data-pos>' +
    (playing === n.id ? dur(audio.currentTime * 1000) : "\u25B6") +
    "</span><span>" + dur(n.duration_ms) + "</span>";
  b.append(bar, len);
  b.onclick = (e) => { e.stopPropagation(); seekOrPlay(n, e); };
  return b;
}

const pct = (n) => playing === n.id && audio.duration
  ? (audio.currentTime / audio.duration) * 100
  : Math.min(100, (n.duration_ms / scaleMs) * 100);

function seekOrPlay(n, e) {
  const bar = $(".bar2", e.currentTarget);
  const r = bar.getBoundingClientRect();
  const at = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  if (playing !== n.id) {
    play(n, at * (n.duration_ms / 1000));
  } else {
    audio.currentTime = at * (audio.duration || n.duration_ms / 1000);
  }
}

function play(n, from) {
  audio.src = "/api/notes/" + n.id + "/audio";
  playing = n.id;
  audio.play().then(() => { if (from) audio.currentTime = from; })
    .catch(() => { playing = 0; banner("Il dispositivo non ha mandato l'audio.",
      "Pu\u00f2 darsi che stia registrando: in quel momento la scheda \u00e8 sua."); });
  drawList();
}

audio.ontimeupdate = () => {
  const li = $('.note[data-id="' + playing + '"]');
  if (!li || !audio.duration) return;
  $(".bar2 i", li).style.width = (audio.currentTime / audio.duration) * 100 + "%";
  $("[data-pos]", li).textContent = dur(audio.currentTime * 1000);
};
audio.onended = () => { playing = 0; drawList(); };

/* ---------------- expanded panel ---------------- */
function panel(n) {
  const box = el("div", "body");
  const t = el("p", "text");
  box.append(t);

  if (n.has_text) {
    t.textContent = "…";
    fetch("/api/notes/" + n.id + "/text").then(r => r.text())
      .then(s => { t.textContent = s.trim(); })
      .catch(() => { t.className = "text none"; t.textContent = "Trascrizione non leggibile."; });
  } else {
    t.className = "text none";
    t.textContent = n.stt === "failed"
      ? "Il server di trascrizione ha risposto con un errore. La nota resta sulla scheda."
      : n.stt === "skipped"
      ? "Trascrizione saltata."
      : "In coda. Il dispositivo la manda al server appena trova la rete.";
  }

  const acts = el("div", "acts");
  const listen = el("button", "btn");
  listen.textContent = playing === n.id && !audio.paused ? "pausa" : "ascolta";
  if (playing === n.id && !audio.paused) listen.classList.add("on");
  listen.onclick = () => {
    if (playing === n.id && !audio.paused) { audio.pause(); drawList(); }
    else if (playing === n.id) { audio.play(); drawList(); }
    else play(n, 0);
  };
  acts.append(listen);

  acts.append(link("\u2193 wav", "/api/notes/" + n.id + "/audio?dl=1",
                   String(n.id).padStart(4, "0") + ".wav"));
  if (n.has_text) {
    acts.append(link("\u2193 txt", "/api/notes/" + n.id + "/text?dl=1",
                     String(n.id).padStart(4, "0") + ".txt"));
  }

  /* Two taps, the same as the device asks for: the second one is the confirm
     screen, not a dialog. */
  const del = el("button", "btn del");
  del.textContent = "elimina";
  del.onclick = () => {
    if (!del.classList.contains("on")) {
      del.classList.add("on");
      del.textContent = "confermi?";
      setTimeout(() => { del.classList.remove("on"); del.textContent = "elimina"; }, 4000);
      return;
    }
    remove(n);
  };
  acts.append(del);

  box.append(acts);
  return box;
}

function link(text, href, name) {
  const a = el("a", "btn");
  a.textContent = text; a.href = href; a.download = name;
  return a;
}

function remove(n) {
  fetch("/api/notes/" + n.id, { method: "DELETE" }).then(r => {
    if (!r.ok) return r.json().then(j => { throw new Error(j.error); });
    if (playing === n.id) { audio.pause(); playing = 0; }
    const li = $('.note[data-id="' + n.id + '"]');
    notes = notes.filter(x => x.id !== n.id);
    if (open === n.id) open = 0;
    if (!li || matchMedia("(prefers-reduced-motion:reduce)").matches) return drawList();
    li.classList.add("gone");
    setTimeout(() => {
      li.style.height = li.offsetHeight + "px";
      li.classList.add("shrink");
      requestAnimationFrame(() => { li.style.height = "0px"; });
      setTimeout(drawList, 240);
    }, 180);
  }).catch(e => banner("Non ho potuto eliminare la nota.", String(e.message || e)));
}

/* ---------------- messages ---------------- */
function message(title, body, action) {
  const d = el("div", "msg");
  const h = el("h2"); h.textContent = title;
  const p = el("p"); p.textContent = body;
  d.append(h, p);
  if (action) {
    const b = el("button", "btn");
    b.textContent = action;
    b.onclick = load;
    d.append(b);
  }
  return d;
}

function banner(title, body) {
  const main = $("#main");
  main.textContent = "";
  main.append(message(title, body, "riprova"));
}

const esc = (s) => String(s).replace(/[<&]/g, c => c === "<" ? "&lt;" : "&amp;");

/* ---------------- load ---------------- */
/*
 * Deliberately no polling. Every request keeps the device out of deep sleep,
 * so a page left open on a bedside table would hold the radio up all night.
 * Refreshing is a tap on the status bar.
 */
async function load() {
  try {
    const [s, n] = await Promise.all([
      fetch("/api/status").then(r => r.json()),
      fetch("/api/notes").then(r => r.json()),
    ]);
    status = s; notes = n;
    drawStatus();
    drawList();
    $("#foot").textContent = [
      s.wifi.ssid || "rete sconosciuta", s.wifi.ip,
      "aggiornato alle " + hhmm(local(s.time)),
      "attivo da " + Math.floor(s.uptime_s / 60) + " min",
    ].join(" · ");
  } catch (e) {
    $("#vitals").textContent = "non raggiungibile";
    banner("Il dispositivo non risponde.",
      "Con ogni probabilit\u00e0 sta dormendo per risparmiare batteria. Premi un tasto e riprova.");
  }
}

$("#bar").onclick = load;
load();
</script>
</body>
</html>
