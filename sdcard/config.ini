# Brain Dumper - copia questo file nella radice della microSD.
# Il dispositivo lo rigenera con i default se manca.

wifi_ssid=
wifi_pass=

# Endpoint STT locale, API OpenAI-compatibile.
# whisper.cpp server / Speaches / faster-whisper-server / LocalAI.
stt_url=http://192.168.1.10:8000/v1/audio/transcriptions
stt_model=Systran/faster-whisper-medium
stt_lang=it
#stt_key=

timezone=CET-1CEST,M3.5.0,M10.5.0/3
ntp_server=pool.ntp.org

# Secondi di inattivita' prima del deep sleep (0 = mai).
idle_sleep_s=120
# Minuti fra i risvegli RTC per smaltire la coda di trascrizione.
wake_interval_min=60
# Durata massima di una singola registrazione, in secondi.
max_record_s=600
